services:
  diskrescue:
    image: ghcr.io/kryo0o/diskrescue:latest
    container_name: diskrescue
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Shanghai
      # 建议启用基础认证（纯内网可省略）
      # DR_USER: admin
      # DR_PASS: "换成你的密码"
    volumes:
      # 需要抢救/写入的磁盘：Unraid 上就是 /mnt
      - /mnt:/mnt
      # 配置、日志、失败清单索引（持久化）
      - ./diskrescue-data:/data
    # 容器内以 root 运行，才能读写 /mnt/diskX
    # 如果目标盘权限特殊，可再放开：
    # privileged: true
