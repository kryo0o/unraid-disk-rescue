name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/diskrescue

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: PHP 语法
        run: |
          set -e
          find app docker -name '*.php' | while read -r f; do
            php -l "$f"
          done
      - name: Shell 语法
        run: |
          set -e
          bash -n app/scripts/disk-rescue.sh
          sh -n docker/entrypoint.sh

  smoke:
    name: 容器冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 构建本地镜像
        run: docker build -f docker/Dockerfile -t diskrescue:test .

      - name: 启动并验证页面/接口
        run: |
          set -e
          mkdir -p /tmp/mnt/disk1/src /tmp/mnt/disk4/dst /tmp/data
          echo hello > /tmp/mnt/disk1/src/a.txt
          docker run -d --name dr -p 18080:80 \
            -v /tmp/mnt:/mnt -v /tmp/data:/data diskrescue:test
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/page.html 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = "1" ] || { docker logs dr; exit 1; }
          grep -q 'id="dr-app"' /tmp/page.html
          curl -fsS 'http://127.0.0.1:18080/api.php?action=status' | tee /tmp/status.json
          grep -q '"ok":true' /tmp/status.json
          curl -fsS 'http://127.0.0.1:18080/api.php?action=browse&path=/mnt' | grep -q 'disk1'
          # 静态资源必须可加载，否则页面按钮点了没反应
          for f in /js/jquery.min.js /js/diskrescue.js /css/diskrescue.css /icons/diskrescue.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$f")
            echo "$f -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # 页面必须带上 jQuery 加载器（容器里 webGUI 不提供 jQuery）
          grep -q 'js/jquery.min.js' /tmp/page.html
          echo "--- doctor ---"
          curl -fsS 'http://127.0.0.1:18080/api.php?action=doctor' | tee /tmp/doctor.json
          # jq -e：任一关键项为 false/null 就失败
          jq -e '.checks.shell_exec and .checks.posix and .checks.data_writable
                 and .checks.mnt_readable
                 and .checks.bin_bash and .checks.bin_setsid and .checks.bin_dd
                 and .checks.bin_find and .checks.bin_timeout' /tmp/doctor.json
          echo "page/api ok"

      - name: 真正启动一次抢救（容器内 start）
        run: |
          set -e
          echo "--- 启动请求返回 ---"
          curl -sS -X POST \
            --data-urlencode 'action=start' \
            --data-urlencode 'src=/mnt/disk1/src' \
            --data-urlencode 'dst=/mnt/disk4/dst' \
            --data-urlencode 'min_speed=0' \
            --data-urlencode 'speed_window=10' \
            --data-urlencode 'check=1' \
            --data-urlencode 'max_stall=1' \
            --data-urlencode 'sync=0' \
            http://127.0.0.1:18080/api.php | tee /tmp/start.json
          grep -q '"ok":true' /tmp/start.json
          for i in $(seq 1 20); do
            [ -f /tmp/mnt/disk4/dst/a.txt ] && break
            sleep 1
          done
          echo "--- 目标目录 ---"
          ls -l /tmp/mnt/disk4/dst
          test -f /tmp/mnt/disk4/dst/a.txt
          test "$(cat /tmp/mnt/disk4/dst/a.txt)" = "hello"
          echo "--- 最终状态 ---"
          for i in $(seq 1 30); do
            curl -sS 'http://127.0.0.1:18080/api.php?action=status' > /tmp/status2.json
            grep -q '"state":"finished"' /tmp/status2.json && break
            sleep 1
          done
          cat /tmp/status2.json
          grep -q '"state":"finished"' /tmp/status2.json
          echo "start/copy ok"

      - name: 清理 .partial 接口
        run: |
          set -e
          echo x > /tmp/mnt/disk4/dst/leftover.partial
          echo x > /tmp/mnt/disk4/dst/some.bin.dr-meta.123
          curl -sS -X POST \
            --data-urlencode 'action=clean_partial' \
            --data-urlencode 'dir=/mnt/disk4/dst' \
            http://127.0.0.1:18080/api.php | tee /tmp/clean.json
          grep -q '"removed":2' /tmp/clean.json
          test ! -f /tmp/mnt/disk4/dst/leftover.partial
          test ! -f /tmp/mnt/disk4/dst/some.bin.dr-meta.123
          test -f /tmp/mnt/disk4/dst/a.txt    # 正常文件不能被误删
          echo "clean_partial ok"

      - name: 失败时输出容器日志
        if: failure()
        run: |
          docker logs dr || true
          echo "--- /data ---"
          docker exec dr ls -la /data /data/state 2>/dev/null || true
          echo "--- 状态文件 ---"
          docker exec dr cat /data/state/status 2>/dev/null || true
          echo "--- 最新日志 ---"
          docker exec dr sh -c 'cat /data/state/*.log 2>/dev/null | tail -50' || true

  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: [lint, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: QEMU（arm64 支持）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
