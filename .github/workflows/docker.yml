name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/diskrescue

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: PHP 语法
        run: |
          set -e
          find package \( -name '*.php' -o -name '*.page' \) | while read -r f; do
            php -l "$f"
          done
      - name: Shell 语法
        run: |
          set -e
          bash -n package/usr/local/emhttp/plugins/diskrescue/scripts/disk-rescue.sh
          bash -n tools/install-local.sh
          sh -n docker/entrypoint.sh

  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: QEMU（arm64 支持）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
