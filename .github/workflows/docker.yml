name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/diskrescue

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4
      - name: PHP 语法
        run: |
          set -e
          find package \( -name '*.php' -o -name '*.page' \) | while read -r f; do
            php -l "$f"
          done
      - name: Shell 语法
        run: |
          set -e
          bash -n package/usr/local/emhttp/plugins/diskrescue/scripts/disk-rescue.sh
          bash -n tools/install-local.sh
          sh -n docker/entrypoint.sh

  smoke:
    name: 容器冒烟测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 构建本地镜像
        run: docker build -f docker/Dockerfile -t diskrescue:test .

      - name: 启动并验证页面/接口
        run: |
          set -e
          mkdir -p /tmp/mnt/disk1/src /tmp/mnt/disk4/dst /tmp/data
          echo hello > /tmp/mnt/disk1/src/a.txt
          docker run -d --name dr -p 18080:80 \
            -v /tmp/mnt:/mnt -v /tmp/data:/data diskrescue:test
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/page.html 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = "1" ] || { docker logs dr; exit 1; }
          grep -q 'id="dr-app"' /tmp/page.html
          curl -fsS 'http://127.0.0.1:18080/api.php?action=status' | tee /tmp/status.json
          grep -q '"ok":true' /tmp/status.json
          curl -fsS 'http://127.0.0.1:18080/api.php?action=browse&path=/mnt' | grep -q 'disk1'
          echo "smoke ok"

      - name: 失败时输出容器日志
        if: failure()
        run: docker logs dr || true

  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: [lint, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: QEMU（arm64 支持）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
